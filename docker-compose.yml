services:
  db:
    image: mysql:8.4
    container_name: pe-destinations-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: pe_destinations
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
